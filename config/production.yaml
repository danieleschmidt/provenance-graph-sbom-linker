# Production Configuration for Provenance Graph SBOM Linker
server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s
  max_connections: 1000

database:
  uri: "bolt://neo4j:7687"
  username: "neo4j"
  password: "changeme"
  max_connections: 50
  connection_timeout: 30s

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0
  max_connections: 100
  connection_timeout: 10s

logging:
  level: "info"
  format: "json"
  output: "stdout"

security:
  enable_tls: true
  cert_file: "/certs/tls.crt"
  key_file: "/certs/tls.key"
  enable_auth: true
  jwt_secret: "${JWT_SECRET}"

observability:
  metrics_enabled: true
  tracing_enabled: true
  otel_endpoint: "http://jaeger:14268/api/traces"
  prometheus_endpoint: "/metrics"

features:
  enable_research_mode: true
  enable_ml_bom: true
  enable_blockchain: true
  enable_ai_security: true